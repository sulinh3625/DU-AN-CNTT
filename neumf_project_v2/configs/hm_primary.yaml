# H&M PRIMARY CONFIG — dataset chính, thay thế DataCo
# Dùng: python run.py all --dataset hm --config configs/hm_primary.yaml --run-tag hm_primary_<tag>
#
# Khác hm.yaml:
#   - evaluation.primary: sampled  (Full Ranking không khả thi O(users*items) ở quy mô này)
#   - start_date: lọc 1 năm cuối để có quy mô đủ lớn mà vẫn train được
#   - batch_size 1024 / epochs 50 / patience 10 — tối ưu cho GPU
#   - k_values đầy đủ [1, 5, 10, 20]

dataset:
  name: hm
  raw_path: data/processed/hm/transactions_clean.parquet
  encoding: utf-8
  k_core: 5
  audit_k_values: [3, 5, 10]
  min_interactions_for_loo: 3
  nrows: null
  start_date: "2019-09-23"   # 1 năm cuối (2019-09-23 → 2020-09-22) — ước tính ~200K-300K users sau k-core
  end_date: null             # lấy đến hết

feedback:
  mode: binary
  confidence_alpha: 1.0

model:
  embedding_dim: 32
  mlp_layers: [64, 32, 16, 8]
  dropout: 0.2
  pretrain_alpha: 0.5

training:
  batch_size: 1024           # tăng cho GPU
  negative_ratio: 4
  pretrain_optimizer: adam
  pretrain_lr: 0.001
  finetune_optimizer: sgd
  finetune_lr: 0.01
  weight_decay: 0.000001
  max_epochs_pretrain: 50
  max_epochs_finetune: 50
  patience: 10
  monitor: NDCG@10
  device: auto               # tự phát hiện GPU
  seed: 42

evaluation:
  primary: sampled           # Sampled-99 — feasible ở mọi quy mô catalog
  k_values: [1, 5, 10, 20]
  sampled_negatives: 99
  tie_break_seed: 2026
  include_redundant_metrics: false
  head_fraction: 0.10        # top 10% popular items = head
  cold_fraction: 0.20        # bottom 20% users theo train count = cold

# ItemKNN bị tắt — O(n_items^2) dense matrix không feasible với 50K+ items
baselines:
  enabled: [random, popularity, bpr, category_popularity]
  bpr:
    embedding_dim: 32
    epochs: 20
    lr: 0.03
    reg: 0.005

side_features:
  articles_path: data/raw/hm/articles.csv
  customers_path: data/raw/hm/customers.csv
  item_id_map_path: data/processed/hm/item_id_map.parquet
  user_id_map_path: data/processed/hm/user_id_map.parquet

content:
  category_col: product_type_name   # 75 loại — đủ phân biệt, không quá thô
  categorical_cols: [product_type_name, product_group_name, colour_group_name,
                     section_name, garment_group_name]

paths:
  outputs_dir: outputs
