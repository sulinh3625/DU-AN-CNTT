# Config mặc định: H&M ~500k dòng lấy mẫu theo khách hàng, trải đủ 2018-09-20 → 2020-09-22.
# Tạo dữ liệu: python run.py sample-hm  (scripts/00_sample_hm.py). k-core 10 cho vừa RAM 16 GB.
# Fine-tune dùng Adam 1e-3 (SGD 0.01 làm NeuMF-Scratch không hội tụ).
# Run tag mặc định: hm500k_seed<seed>.
dataset:
  name: hm
  raw_path: data/processed/hm/hm500k_transactions.csv
  encoding: utf-8
  k_core: 10
  audit_k_values: [3, 5, 10]
  min_interactions_for_loo: 3
  nrows: null
  start_date: null
  end_date: null

feedback:
  mode: binary
  confidence_alpha: 1.0

model:
  embedding_dim: 32
  mlp_layers: [64, 32, 16, 8]
  dropout: 0.2
  pretrain_alpha: 0.5

training:
  batch_size: 512
  negative_ratio: 4
  pretrain_optimizer: adam
  pretrain_lr: 0.001
  finetune_optimizer: adam
  finetune_lr: 0.001
  weight_decay: 0.000001
  max_epochs_pretrain: 20
  max_epochs_finetune: 20
  patience: 7
  monitor: NDCG@10
  device: auto
  seed: 42

evaluation:
  primary: full_ranking
  k_values: [5, 10]
  sampled_negatives: 99
  tie_break_seed: 2026
  include_redundant_metrics: false
  head_fraction: 0.10
  cold_fraction: 0.20

baselines:
  enabled: [random, popularity, popularity_recent, bpr, ials]
  popularity_window_days: 28      # MostPopular-Recent: 4 tuần cuối của train
  bpr:
    embedding_dim: 32
    epochs: 20
    lr: 0.03
    reg: 0.005
  ials:                           # tham số khởi đầu; tune ở Pha 4 cùng ngân sách với NeuMF
    factors: 64
    regularization: 0.01
    alpha: 1.0
    iterations: 15

paths:
  outputs_dir: outputs
